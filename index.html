<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Participe e ganhe prémios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffc61a;--gold2:#ff9d00;--gold3:#ffe27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{position:relative;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:30px;padding:30px 18px 26px;color:#fff6dc;font-family:"Barlow",system-ui,sans-serif;
  background:#050607}
/* estádio: feixes de luz + relvado */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(520px 420px at 12% -6%,rgba(255,255,255,.22),transparent 70%),
   radial-gradient(520px 420px at 88% -6%,rgba(255,198,26,.32),transparent 70%),
   radial-gradient(900px 500px at 50% 38%,rgba(255,198,26,.14),transparent 70%),
   linear-gradient(180deg,#040506 0%,#08150c 48%,#0f4a22 82%,#176b30 100%)}
.stage::before{content:"";position:absolute;inset:auto 0 0 0;height:42%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 70px,transparent 70px 140px);
  -webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent)}
.stage::after{content:"";position:absolute;inset:0;
  background:conic-gradient(from 200deg at 12% -10%,transparent 0 6%,rgba(255,255,255,.07) 8% 10%,transparent 12% 100%),
             conic-gradient(from 148deg at 88% -10%,transparent 0 6%,rgba(255,198,26,.09) 8% 10%,transparent 12% 100%)}
/* confetti dourado */
.conf{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-30px;background:linear-gradient(135deg,var(--gold3),var(--gold2));border-radius:2px;opacity:.85;transform:rotate(var(--r));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(calc(var(--r) + 360deg))}}

.card,.btn,footer{position:relative;z-index:2}
/* cartaz com borda dourada em brilho */
.card{display:block;width:100%;max-width:560px;padding:4px;border-radius:26px;
  background:linear-gradient(135deg,var(--gold3),var(--gold2) 35%,#fff 50%,var(--gold) 65%,var(--gold2));
  box-shadow:0 0 50px rgba(255,198,26,.38),0 30px 80px rgba(0,0,0,.7)}
.card img{display:block;width:100%;height:auto;border-radius:22px}
.card::after{content:"";position:absolute;inset:4px;border-radius:22px;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:250% 100%;background-position:150% 0}
/* botão */
.btn{display:block;overflow:hidden;width:100%;max-width:560px;text-align:center;text-decoration:none;font-family:"Anton","Impact",sans-serif;text-transform:uppercase;font-size:34px;letter-spacing:.03em;
  padding:19px 24px;border-radius:999px;color:#14100a;background:linear-gradient(180deg,var(--gold3),var(--gold) 50%,var(--gold2));
  box-shadow:0 0 0 3px rgba(0,0,0,.65),0 0 0 6px var(--gold),0 14px 44px rgba(255,170,0,.5);transition:transform .15s ease}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.btn:hover{transform:translateY(-3px) scale(1.02)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:5px}
footer{margin-top:auto;font-size:14px;color:#d4cdb0;text-align:center;text-shadow:0 1px 3px #000}

@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .9s cubic-bezier(.2,.8,.2,1) both,glow 3.2s ease-in-out .9s infinite}
  .btn{animation:rise .9s cubic-bezier(.2,.8,.2,1) .25s both,pulse 2.2s ease-in-out 1.2s infinite}
  .btn::after{animation:shine 3.6s ease-in-out 1.6s infinite}
  .card::after{animation:sweep 5s ease-in-out 1.4s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes glow{50%{box-shadow:0 0 80px rgba(255,198,26,.6),0 30px 80px rgba(0,0,0,.7)}}
  @keyframes pulse{50%{transform:scale(1.035)}}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  @keyframes sweep{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
}
@media (prefers-reduced-motion:reduce){.conf{display:none}.btn,.btn:hover{transition:none;transform:none}}
</style>
</head>
